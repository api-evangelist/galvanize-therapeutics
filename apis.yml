name: Galvanize Therapeutics
description: 'Galvanize Therapeutics, Inc. is a Redwood City, California medical device
  company founded in 2015 by Jonathan Waldstreicher, MD and William Krimsky, MD, and
  created and incubated by Apple Tree Partners (ATP). Galvanize develops pulsed electric
  field (PEF) therapies that deliver high-voltage, short-duration energy locally to
  alter the transmembrane potential of targeted cells, inducing non-thermal regulated
  cell death without denaturing cellular proteins or the extracellular matrix. Its
  Aliya PEF System is cleared for surgical ablation of soft tissue and is being studied
  in non-small cell lung cancer, while RheOx addresses chronic bronchitis in the airway.
  The company received FDA 510(k) clearance for the Aliya EX Generator in May 2026.
  Galvanize is a privately held, clinically-focused device manufacturer and publishes
  no public developer program, API, SDK, or machine-readable interface.'
